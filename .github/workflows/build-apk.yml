name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK & Publish Direct Download Link
        working-directory: ./android-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SMS-Payment-Monitor.apk
          cd ..
          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release create v1.0.0 SMS-Payment-Monitor.apk --title "تطبيق راصد مدفوعات SMS" --notes "رابط تحميل مباشر للهواتف بدون تسجيل دخول"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMS-Payment-Monitor-APK
          path: SMS-Payment-Monitor.apk
