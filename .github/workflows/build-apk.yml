name: Build Android APK & Deploy Dashboard

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: بناء تطبيق الأندرويد (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ./android-app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for Easy Download
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk SMS-Payment-Monitor.apk

      - name: Upload APK as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMS-Payment-Monitor-APK
          path: SMS-Payment-Monitor.apk
          retention-days: 90
